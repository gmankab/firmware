[workspace]
members = ["crates/nabu-firmware-research", "crates/nabu-qrisc", "crates/nabu-ir3"]
default-members = ["crates/nabu-firmware-research", "crates/nabu-qrisc", "crates/nabu-ir3"]
exclude = ["experiments/hexagon-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
nabu-qrisc = { path = "crates/nabu-qrisc" }
nabu-ir3 = { path = "crates/nabu-ir3" }
