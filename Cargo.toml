[workspace]
members = ["crates/firmware-tools", "crates/qrisc", "crates/ir3", "crates/arm32", "crates/venus-controller", "crates/venus-tail"]
default-members = ["crates/firmware-tools", "crates/qrisc", "crates/ir3", "crates/arm32", "crates/venus-controller", "crates/venus-tail"]
exclude = ["experiments/hexagon-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
qrisc = { path = "crates/qrisc" }
ir3 = { path = "crates/ir3" }
arm32 = { path = "crates/arm32" }
